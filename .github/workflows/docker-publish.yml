name: Release & Publish Docker Image

on:
  push:
    tags:
      - '[0-9]*'
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión para la release (opcional, ej: 1.0.0. Si se omite, lee la de package.json)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-and-publish:
    name: Release, Docker Publish & Version Bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve release version
        id: versioning
        run: |
          RAW_VERSION="${{ inputs.version }}"
          if [ -n "$RAW_VERSION" ]; then
            # Usuario proporcionó versión manual (se elimina prefijo 'v' si existiera)
            CLEAN_VERSION="${RAW_VERSION#v}"
            echo "Usando versión manual indicada por el usuario: $CLEAN_VERSION"
            # Actualizar package.json y package-lock.json sin generar tag de git aún
            npm version "$CLEAN_VERSION" --no-git-tag-version --allow-same-version
            echo "is_custom=true" >> $GITHUB_OUTPUT
          else
            # Leer versión actual del proyecto
            if [ "${{ github.ref_type }}" = "tag" ]; then
              CLEAN_VERSION="${GITHUB_REF_NAME#v}"
            else
              CLEAN_VERSION=$(node -p "require('./package.json').version")
            fi
            echo "Leyendo versión actual del proyecto: $CLEAN_VERSION"
            echo "is_custom=false" >> $GITHUB_OUTPUT
          fi

          echo "release_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Commit release version if specified by user
        if: steps.versioning.outputs.is_custom == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            TARGET_BRANCH="${{ github.ref_name }}"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              TARGET_BRANCH="${{ github.event.repository.default_branch || 'master' }}"
            fi
            git commit -m "chore(release): prepare release ${{ steps.versioning.outputs.release_version }}"
            git push origin HEAD:$TARGET_BRANCH || echo "Aviso: No se pudo hacer push a $TARGET_BRANCH."
          fi

      - name: Run automated tests
        run: npm test

      - name: Create and push Git Tag
        run: |
          TAG_NAME="${{ steps.versioning.outputs.release_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Crear y publicar tag sin prefijo 'v' si no existe
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1 && ! git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q "refs/tags/$TAG_NAME"; then
            echo "Creando tag $TAG_NAME..."
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          else
            echo "Tag $TAG_NAME ya existe o ya fue creado."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.versioning.outputs.release_version }}
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.versioning.outputs.release_version }}"
          IMAGE_NAME_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "## 📦 Información de la Versión"
            echo ""
            echo "- **Versión:** \`${TAG_NAME}\`"
            echo "- **Imagen Docker:** \`${IMAGE_NAME_LOWER}:${TAG_NAME}\`"
            echo "- **Tag latest:** \`${IMAGE_NAME_LOWER}:latest\`"
            echo ""
            echo "### 🐳 Despliegue rápido con Docker"
            echo '```bash'
            echo "# Descargar y arrancar la versión ${TAG_NAME}"
            echo "docker pull ${IMAGE_NAME_LOWER}:${TAG_NAME}"
            echo "docker run -d -p 8080:80 --name fin-car-app ${IMAGE_NAME_LOWER}:${TAG_NAME}"
            echo '```'
            echo ""
            echo "### 📦 Arranque con Docker Compose"
            echo '```bash'
            echo "DOCKER_IMAGE=${IMAGE_NAME_LOWER}:${TAG_NAME} docker compose up -d"
            echo '```'
            echo ""
            echo "---"
          } > release_notes.md

          # Crear o actualizar GitHub Release
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creando GitHub Release para $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes-file release_notes.md \
              --generate-notes
          else
            echo "GitHub Release para $TAG_NAME ya existe. Actualizando notas..."
            gh release edit "$TAG_NAME" --notes-file release_notes.md
          fi

      - name: Bump patch version and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TARGET_BRANCH="${{ github.event.repository.default_branch || 'master' }}"
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            git checkout "$TARGET_BRANCH"
            git pull origin "$TARGET_BRANCH"
          fi

          # Incrementar el patch en package.json y package-lock.json
          npm version patch --no-git-tag-version
          NEXT_VERSION=$(node -p "require('./package.json').version")
          echo "Nueva versión incrementada (patch): $NEXT_VERSION"

          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $NEXT_VERSION"
            git push origin HEAD:$TARGET_BRANCH || echo "Aviso: No se pudo hacer push directo a $TARGET_BRANCH (posible protección de rama)."
          else
            echo "No se detectaron cambios para commitear."
          fi
