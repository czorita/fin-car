<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <!-- @include partials/head-meta.html -->
    <meta
      name="description"
      content="Comparador y normalizador financiero de ofertas de coches: calcula costes totales reales, sobrecostes de financiación, precio contado equivalente y analiza si las ofertas de los concesionarios compensan o son una trampa."
    />
    <title>FinCar — Comparador y normalizador de ofertas de coches</title>
  </head>
  <body>
    <div class="ambient-glow" aria-hidden="true"></div>

    <div class="app-layout">
      <!-- Cabecera compacta: marca + acción principal + menú secundario -->
      <header class="app-header">
        <div class="brand-wrapper">
          <div class="brand-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 11 2 11.5 2 12v4c0 .6.4 1 1 1h2"
              />
              <circle cx="7" cy="17" r="2" />
              <path d="M9 17h6" />
              <circle cx="17" cy="17" r="2" />
            </svg>
          </div>
          <h1 class="brand-title">FinCar</h1>
        </div>

        <nav class="header-actions" aria-label="Acciones de la aplicación">
          <button id="btn-new-offer" class="btn btn-primary" type="button">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              aria-hidden="true"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
            <span class="btn-new-offer-text">Nueva oferta</span>
          </button>

          <details class="header-menu">
            <summary class="btn btn-ghost btn-icon" title="Más opciones" aria-label="Más opciones">⋯</summary>
            <div class="header-menu-panel" role="menu">
              <button id="btn-reverse-calc" class="header-menu-item" type="button" role="menuitem">
                🔍 Calcular el interés desde la cuota
              </button>
              <a href="/ejemplos.html" class="header-menu-item" role="menuitem">👀 Ver ofertas de ejemplo</a>
              <button id="btn-theme-toggle" class="header-menu-item" type="button" role="menuitem">
                <span id="theme-toggle-icon">☀️</span> Cambiar tema claro/oscuro
              </button>
            </div>
          </details>
        </nav>
      </header>

      <!-- @include partials/vehicle-bar.html -->

      <!-- Panel: ofertas de un coche -->
      <section id="tab-same-vehicle-panel" role="region" aria-label="Ofertas del coche seleccionado">
        <main id="offers-display-slot"></main>
      </section>

      <!-- Panel: comparativa entre todos los coches -->
      <section id="tab-cross-vehicle-panel" role="region" aria-label="Comparativa entre coches" hidden>
        <div id="cross-display-slot"></div>
      </section>

      <!-- @include partials/analytics-section.html -->

      <!-- Botón Flotante para Móvil -->
      <div class="mobile-fab">
        <button id="fab-new-offer" class="btn btn-primary btn-icon" title="Añadir oferta" type="button">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            aria-hidden="true"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Modales Nativos -->
    <!-- @include partials/modal-offer.html -->
    <!-- @include partials/modal-amortization.html -->
    <!-- @include partials/modal-trap-guide.html -->

    <!-- Plantillas HTML5 -->
    <!-- @include partials/tmpl-offer-card.html -->
    <!-- @include partials/tmpl-linked-product.html -->
    <!-- @include partials/tmpl-included-service.html -->

    <!-- Plantilla de Estado Vacío -->
    <template id="tmpl-empty-state">
      <div class="empty-state-card">
        <div class="empty-state-icon" aria-hidden="true">🚗</div>
        <h3 class="empty-state-title">No tienes ningún presupuesto guardado</h3>
        <p class="empty-state-text">
          Comienza creando tu primera oferta personalizada o explora las
          <strong>ofertas de ejemplo precargadas</strong> para ver cómo funciona el comparador.
        </p>
        <div class="empty-state-actions">
          <button class="btn btn-primary empty-add-btn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 5v14M5 12h14" />
            </svg>
            Nueva oferta
          </button>
          <a href="/ejemplos.html" class="btn btn-secondary empty-examples-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="16" x2="12" y2="12" />
              <line x1="12" y1="8" x2="12.01" y2="8" />
            </svg>
            👀 Ver ejemplos
          </a>
        </div>
      </div>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
