<!-- Modal Cuadro de Amortización Francés -->
<dialog id="modal-amortization" class="app-modal">
  <div class="modal-header">
    <h2 id="amortization-car-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Cuadro de amortización francés
    </h2>
    <button id="btn-close-amortization" class="btn btn-ghost btn-icon" type="button">&times;</button>
  </div>

  <div class="modal-body">
    <div class="amortization-kpi-grid">
      <div class="kpi-card kpi-card--compact">
        <div class="kpi-label">Capital prestado</div>
        <div class="kpi-value" id="amort-principal">0 €</div>
      </div>
      <div class="kpi-card kpi-card--compact">
        <div class="kpi-label">Total intereses</div>
        <div class="kpi-value" id="amort-interests">0 €</div>
      </div>
      <div class="kpi-card kpi-card--compact">
        <div class="kpi-label">Cuota mensual</div>
        <div class="kpi-value" id="amort-monthly">0 €/mes</div>
      </div>
    </div>

    <div class="amortization-table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>Mes</th>
            <th>Cuota</th>
            <th>Capital amortizado</th>
            <th>Intereses pagados</th>
            <th>Saldo pendiente</th>
          </tr>
        </thead>
        <tbody id="amortization-tbody">
          <!-- Filas de meses -->
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" id="btn-done-amortization" class="btn btn-secondary">Cerrar</button>
  </div>
</dialog>
