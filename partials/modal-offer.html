<!-- Modal Formulario de Oferta -->
<dialog id="modal-offer" class="app-modal">
  <div class="modal-header">
    <h2 id="modal-offer-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Configurar oferta
    </h2>
    <button id="btn-close-offer-modal" class="btn btn-ghost btn-icon" type="button">&times;</button>
  </div>

  <form id="form-offer" class="modal-body">
    <input type="hidden" id="offer-id" />

    <div class="form-group">
      <label class="form-label" for="offer-vehicle">
        Vehículo / modelo *
        <span class="helper-icon" title="Modelo de coche sobre el que se aplica la oferta">ⓘ</span>
      </label>
      <input type="text" id="offer-vehicle" list="vehicles-datalist" class="form-input" placeholder="Ej: Hyundai Tucson, Toyota RAV4" required autocomplete="off" />
      <datalist id="vehicles-datalist"></datalist>
    </div>

    <!-- Vista Previa Automática del Modelo Detectado -->
    <div class="vehicle-auto-preview-container" id="vehicle-auto-preview" style="display: none;">
      <div class="vehicle-image-preview-box" id="vehicle-image-preview" title="Vista previa del modelo">
        <div class="vehicle-image-placeholder" id="vehicle-image-placeholder">🚗</div>
        <img id="vehicle-image-thumb" src="" alt="Vista previa del modelo" style="display: none;" />
      </div>
      <div class="vehicle-auto-preview-info">
        <span class="vehicle-auto-preview-badge">✓ Foto oficial vinculada automáticamente</span>
        <span class="form-helper" id="vehicle-image-status">Fotografía asignada desde el catálogo para las comparativas.</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="form-group">
        <label class="form-label" for="offer-dealer">Concesionario / vendedor</label>
        <input type="text" id="offer-dealer" class="form-input" placeholder="Ej: Concesionario Oficial Madrid" />
      </div>
      <div class="form-group">
        <label class="form-label" for="offer-notes">Notas / acabado</label>
        <input type="text" id="offer-notes" class="form-input" placeholder="Ej: Pintura bi-tono, entrega 15 días" />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Modalidad de oferta</label>
      <div class="segmented-control" id="modality-selector">
        <button type="button" class="segmented-btn" data-val="cash">Al contado</button>
        <button type="button" class="segmented-btn active" data-val="standard_finance">Financiación lineal</button>
        <button type="button" class="segmented-btn" data-val="flexible_finance">Flexible / multiopción</button>
      </div>
    </div>

    <div id="price-fields-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="form-group" id="group-vehicle-price" style="margin-bottom: 0.5rem;">
        <label class="form-label" for="offer-price">
          Precio del vehículo *
          <span class="helper-icon" title="Precio base o presupuesto del vehículo sin descontar la financiación">ⓘ</span>
        </label>
        <div class="input-wrapper">
          <input type="text" inputmode="decimal" id="offer-price" class="form-input has-addon" placeholder="Ej: 27500 o 27.500,00" required />
          <span class="input-addon">€</span>
        </div>
      </div>

      <div class="form-group" id="group-finance-discount" style="margin-bottom: 0.5rem;">
        <label class="form-label" for="finance-discount">
          Descuento por financiar
          <span class="helper-icon" title="Descuento en el precio del coche que promete el concesionario a cambio de financiar">ⓘ</span>
        </label>
        <div class="input-wrapper">
          <input type="text" inputmode="decimal" id="finance-discount" class="form-input has-addon" placeholder="Ej: 3300 o 3.300,00" />
          <span class="input-addon">€</span>
        </div>
      </div>
    </div>

    <!-- Indicador dinámico del Precio Resultante para Cálculos -->
    <div id="net-calc-price-indicator" class="calc-price-summary" style="margin-bottom: 1rem;">
      <span class="calc-price-label">Precio base de cálculo (Precio - Descuento):</span>
      <span class="calc-price-val" id="net-calc-price-val">24.200 €</span>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="form-group" id="group-down-payment">
        <label class="form-label" for="down-payment">Entrada (€)</label>
        <div class="input-wrapper">
          <input type="text" inputmode="decimal" id="down-payment" class="form-input has-addon" placeholder="4000 o 4.000,00" />
          <span class="input-addon">€</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="trade-in-value">Tasación coche usado</label>
        <div class="input-wrapper">
          <input type="text" inputmode="decimal" id="trade-in-value" class="form-input has-addon" placeholder="0" />
          <span class="input-addon">€</span>
        </div>
      </div>
    </div>

    <!-- Campos Específicos de Financiación -->
    <div id="finance-fields-container">
      <div style="border-top: 1px solid var(--border-subtle); padding-top: 1rem; margin-top: 0.5rem; margin-bottom: 0.5rem;">
        <h4 style="font-size: 0.95rem; margin-bottom: 0.75rem; color: var(--accent-cyan);">Parámetros de financiación</h4>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="loan-months" style="display: flex; justify-content: space-between; align-items: center;">
            <span>Plazo (meses)</span>
            <span id="loan-months-badge" class="months-duration-badge">5 años</span>
          </label>
          <div class="input-wrapper">
            <input type="number" id="loan-months" class="form-input has-addon" min="1" max="240" step="1" placeholder="60" value="60" required />
            <span class="input-addon">meses</span>
          </div>
          <div class="months-quick-pills" id="loan-months-pills">
            <button type="button" class="months-pill-btn" data-months="24">24m</button>
            <button type="button" class="months-pill-btn" data-months="36">36m</button>
            <button type="button" class="months-pill-btn" data-months="48">48m</button>
            <button type="button" class="months-pill-btn active" data-months="60">60m</button>
            <button type="button" class="months-pill-btn" data-months="72">72m</button>
            <button type="button" class="months-pill-btn" data-months="84">84m</button>
            <button type="button" class="months-pill-btn" data-months="96">96m</button>
            <button type="button" class="months-pill-btn" data-months="120">120m</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="loan-tin">
            TIN anual (%)
            <span class="helper-icon" title="Tipo de Interés Nominal fijado en el contrato">ⓘ</span>
          </label>
          <div class="input-wrapper">
            <input type="text" inputmode="decimal" id="loan-tin" class="form-input has-addon" placeholder="8,5" />
            <span class="input-addon">%</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="manual-monthly">
            O cuota ofertada (€)
            <span class="helper-icon" title="Opcional: Si el comercial te fijó la cuota mensual exacta">ⓘ</span>
          </label>
          <div class="input-wrapper">
            <input type="text" inputmode="decimal" id="manual-monthly" class="form-input has-addon" placeholder="Autocalcular (ej: 345,50)" />
            <span class="input-addon">€/mes</span>
          </div>
        </div>
      </div>

      <!-- Cuota Final (Multiopción) -->
      <div id="flexible-balloon-container" style="display: none; background: rgba(59, 130, 246, 0.07); padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; border: 1px dashed rgba(59, 130, 246, 0.3);">
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label" for="balloon-payment">
            Cuota final / valor futuro (VFG) *
            <span class="helper-icon" title="Último pago balloon de la financiación flexible">ⓘ</span>
          </label>
          <div class="input-wrapper">
            <input type="text" inputmode="decimal" id="balloon-payment" class="form-input has-addon" placeholder="13000 o 13.000,00" />
            <span class="input-addon">€</span>
          </div>
        </div>
      </div>

      <!-- Productos Vinculados -->
      <div style="margin-top: 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <label class="form-label" style="margin: 0;">
            Productos obligatorios vinculados
            <span class="helper-icon" title="Seguros de vida, packs de mantenimiento, etc. exigidos para obtener el descuento">ⓘ</span>
          </label>
          <button type="button" id="btn-add-product" class="btn btn-secondary btn-sm">+ Añadir seguro/pack</button>
        </div>
        <div id="linked-products-list" style="display: flex; flex-direction: column; gap: 0.5rem;">
          <!-- Se inyectan filas con tmpl-linked-product -->
        </div>
      </div>
    </div>

    <div class="modal-footer" style="margin: 1.5rem -1.5rem -1.5rem -1.5rem;">
      <button type="button" id="btn-cancel-offer" class="btn btn-ghost">Cancelar</button>
      <button type="submit" class="btn btn-primary">Guardar oferta</button>
    </div>
  </form>
</dialog>
