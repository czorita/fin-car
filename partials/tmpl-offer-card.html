<!-- Plantilla de Tarjeta de Oferta -->
<template id="tmpl-offer-card">
  <article class="offer-card">
    <header class="offer-header">
      <div class="offer-badges"></div>
      <h2 class="offer-title"></h2>
      <div class="offer-dealer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span class="dealer-text"></span>
      </div>
    </header>

    <div class="offer-cost-hero">
      <div class="cost-hero-label">Coste total real</div>
      <div class="cost-hero-amount">0 €</div>
      <div class="cost-hero-sub"></div>
    </div>

    <div class="card-verdict-alert">
      <strong class="verdict-badge-text"></strong>: <span class="verdict-msg-text"></span>
      <button type="button" class="verdict-trap-link" aria-haspopup="dialog">💡 ¿Cómo detectar esta trampa?</button>
    </div>

    <div class="offer-specs-list"></div>

    <div class="offer-notes-box">
      <span class="notes-text"></span>
    </div>

    <footer class="card-actions">
      <button class="btn btn-secondary btn-sm btn-edit btn-flex-1" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Editar
      </button>
      <button class="btn btn-ghost btn-sm btn-schedule" title="Ver tabla de amortización mes a mes" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Amortización
      </button>
      <button class="btn btn-danger-ghost btn-sm btn-delete" title="Eliminar oferta" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </footer>
  </article>
</template>
