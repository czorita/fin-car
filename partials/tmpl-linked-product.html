<!-- Plantilla de Producto Vinculado en Formulario -->
<template id="tmpl-linked-product">
  <div class="linked-product-row">
    <input type="text" class="form-input btn-sm prod-name list-row-input" placeholder="Nombre (ej. Seguro Vida)" />
    <div class="input-wrapper">
      <input
        type="text"
        inputmode="decimal"
        class="form-input btn-sm prod-cost has-addon list-row-input"
        placeholder="Coste"
      />
      <span class="input-addon">€</span>
    </div>
    <label class="checkbox-label checkbox-label--small">
      <input type="checkbox" class="prod-financed" checked />
      ¿Financiado?
    </label>
    <button type="button" class="btn btn-ghost btn-sm btn-remove-prod list-row-remove">&times;</button>
  </div>
</template>
