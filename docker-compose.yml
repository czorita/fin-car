services:
  car-compare:
    # Imagen publicada en GitHub Container Registry (o la que se defina en DOCKER_IMAGE)
    image: ${DOCKER_IMAGE:-ghcr.io/tu-usuario-o-org/car-compare:latest}
    # Descomenta 'build' si deseas compilar localmente en desarrollo en vez de usar la imagen publicada:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: car-compare-app
    restart: unless-stopped
    ports:
      - "8080:80"
